name: Predictive Oncology  (Precision Therapeutics)
description: 'Predictive Oncology (Precision Therapeutics) is an AI-driven drug-discovery and precision-oncology
  company. It combines a proprietary biobank of 150,000+ tumor samples with machine-learning models to predict
  patient and drug responses, develops 3D in vitro tumor models that simulate human tissue environments for
  drug testing, and offers tumor drug-response testing and genomic profiling to support personalized cancer
  treatment and improve the probability of success in clinical trials. The company engages partners through
  direct B2B collaboration and publishes no public developer API, SDK, or developer portal. Surfaced as a
  portfolio company of Bain Capital Ventures and profiled in the API Evangelist network.'
